# LOCAL / EVALUATION ONLY. Uses the public LiveKit dev key pair, plain HTTP and no TLS.
# Camera/microphone work on http://localhost because browsers treat localhost as a secure context.
# Never expose this stack to the internet. For a real deployment use docker-compose.yml.
#   docker compose -f deploy/docker-compose.local.yml up --build
name: homequarters-local
services:
  homequarters:
    build: { context: .., dockerfile: deploy/Dockerfile }
    environment:
      HQ_ENV: dev
      HQ_ADDR: ":8080"
      HQ_DB: "${HQ_DB:-/data/homequarters.db}"
      HQ_ALLOWED_ORIGINS: "localhost:*,127.0.0.1:*"
      LIVEKIT_URL: ws://localhost:7880
      LIVEKIT_API_URL: http://livekit:7880
      LIVEKIT_API_KEY: devkey
      LIVEKIT_API_SECRET: secret
    ports: ["127.0.0.1:8080:8080"]
    volumes: ["homequarters-data:/data"]
    depends_on: [livekit]
  livekit:
    image: livekit/livekit-server:v1.13.7
    # the address it announces for media: this computer only, or HQ_LK_NODE_IP for other computers of the
    # network (scripts/dev.sh --lan)
    command: ["--dev", "--bind", "0.0.0.0", "--node-ip", "${HQ_LK_NODE_IP:-127.0.0.1}"]
    ports:
      - "127.0.0.1:7880:7880"
      - "7881:7881"
      - "7882:7882/udp"
volumes:
  homequarters-data:
    name: "${HQ_DATA_VOLUME:-${COMPOSE_PROJECT_NAME:-homequarters-local}_homequarters-data}"
