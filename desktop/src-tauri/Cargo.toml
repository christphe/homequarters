[package]
name = "homequarters-desktop"
version = "0.1.0"
description = "Home Quarters desktop client: the office's web client in its own window"
license = "AGPL-3.0-only"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
getrandom = "0.3"
sha2 = "0.10"

# The shell is a few hundred lines around the system webview: build it small.
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

# Lints (decision 0040): clippy's default groups as errors, plus the few pedantic and nursery lints whose
# findings here were real. `cargo clippy --all-targets -- -D warnings` runs them (desktop's fdash task
# lint:rust and the Desktop workflow); `cargo fmt --check` checks the format (rustfmt.toml).
[lints.rust]
# the shell calls system APIs only where it must (macOS idle time and keyboard layout): each unsafe block
# carries #[allow(unsafe_code)] with its reason
unsafe_code = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
# pedantic: a stable sort of primitives does needless work
stable_sort_primitive = "deny"
# nursery: a clone whose original is never used again; a PartialEq type that could also be Eq
redundant_clone = "deny"
derive_partial_eq_without_eq = "deny"
