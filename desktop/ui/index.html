<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>Home Quarters</title>
    <link rel="stylesheet" href="setup.css" />
    <script src="setup.js" defer></script>
  </head>
  <body>
    <main class="card">
      <img class="logo" src="icon.svg" alt="" width="56" height="56" />
      <h1>Home Quarters</h1>
      <section id="saved" hidden aria-labelledby="saved-title">
        <h2 id="saved-title">Your offices</h2>
        <ul id="list"></ul>
      </section>
      <form id="office">
        <label for="address">Address of an office</label>
        <input id="address" name="address" type="text" inputmode="url" autocomplete="url" spellcheck="false"
          placeholder="office.example.com" aria-describedby="hint error" required />
        <p id="hint" class="hint">The one you open in your browser. Switch between your offices from the Office menu.</p>
        <p id="error" class="error" role="alert"></p>
        <div class="actions">
          <button type="button" id="cancel" class="secondary" hidden>Cancel</button>
          <button type="submit" class="primary">Open</button>
        </div>
      </form>
    </main>
  </body>
</html>
