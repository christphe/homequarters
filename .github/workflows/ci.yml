name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  actions: read # to download the records main's runs published

# The checks run through fdash (tools/fdash, fdash-workspace.json, decision 0035), by the conventional task
# names every project uses: `unit` runs lint, build and test:unit; `integration` builds the server and runs
# test:integration (against the testbed); `e2e` builds the server and the client, then runs one shard of
# test:e2e (scenarios of the e2e project and plugin e2e projects). A check or a browser scenario that already passed on main with the same inputs is reported
# CACHED and not run again; a cached build restores its outputs (the binary, web/dist, site/dist) with it.
# The records come only from runs of a push to main, which publish them as an artifact of their own run, one
# per job; every job (a pull request's too) downloads its artifact from main's latest finished run. Nothing a
# pull request runs can add to it: a run of a pull request publishes no records, and reading them from
# anywhere else would need a change to this file in the pull request's final diff. actions/cache is not used
# because a pull request's own scope is searched first and an earlier commit of it could save one. Each main
# job publishes only the records its run used or made (fdash touches the records and outputs it finds; older
# ones are deleted first), so they stay the size of one run.
# (The Go and pnpm caches of setup-go and setup-node still use actions/cache, as before.)

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.27.3"
          cache-dependency-path: |
            server/go.sum
            bench/mediagen/go.sum
            tools/go/*/go.sum
      # the version comes from packageManager in the root package.json
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      # one install for the repository (pnpm workspace): every project's tools and dependencies
      - run: pnpm install --frozen-lockfile
      - name: Records of the checks that passed on main (its latest run's artifact)
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci-fdash-records.ts fdash-unit
      # lint:repo: actionlint and zizmor, gitleaks, shellcheck, hadolint (scripts/lint-repo.ts); lint:vuln:
      # govulncheck on the server, keyed on the day as well, since its database changes without the code
      - name: Lint, build and unit tests (fdash run lint lint:repo lint:vuln build test:unit)
        id: gates
        run: |
          date +%s > "$RUNNER_TEMP/fdash-start"
          node tools/fdash/cli.ts run lint lint:repo lint:vuln build test:unit
        env:
          FDASH_LOG_DIR: ${{ runner.temp }}/fdash-logs
      - name: Logs of the checks
        if: failure() && steps.gates.outcome == 'failure'
        run: for f in "$RUNNER_TEMP"/fdash-logs/*/*.log; do echo "::group::$(basename "$f")"; cat "$f"; echo "::endgroup::"; done
      - name: Logs of the checks (artifact)
        if: failure() && steps.gates.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unit-logs
          path: ${{ runner.temp }}/fdash-logs
      - name: Keep only the records this run used
        if: always() && github.ref == 'refs/heads/main' && github.event_name == 'push' && steps.gates.outcome != 'skipped'
        run: mkdir -p .fdash/cache && find .fdash/cache -type f ! -newermt "@$(cat "$RUNNER_TEMP/fdash-start")" -delete && find .fdash/cache -mindepth 1 -type d -empty -delete
      - name: Publish the records (main only)
        if: always() && github.ref == 'refs/heads/main' && github.event_name == 'push' && steps.gates.outcome != 'skipped'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fdash-unit
          path: .fdash/cache
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14
      # the server's binary is fdash's server build, above
      - name: Build the load generator
        working-directory: server
        run: go build ./cmd/loadgen
      # the same golangci-lint and govulncheck as the server's, pinned in tools/go/
      - name: Lint and build the media benchmark tool
        working-directory: bench/mediagen
        run: |
          go tool -modfile=../../tools/go/golangci-lint/go.mod golangci-lint run ./...
          go tool -modfile=../../tools/go/govulncheck/go.mod govulncheck ./...
          go build -o /dev/null .

  # Tests against a real server without a browser: each test:integration starts the testbed (homequarters
  # testbed), built here with the race detector.
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOFLAGS: -race
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.27.3"
          cache-dependency-path: server/go.sum
      # the version comes from packageManager in the root package.json
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      # the integration suites run under the projects' own test runner
      - run: pnpm install --frozen-lockfile
      - name: Records of the checks that passed on main (its latest run's artifact)
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci-fdash-records.ts fdash-integration
      # the build first, in a run of its own: a test:integration does not wait for another project's build
      - name: Integration tests (fdash run build --pkg server, then test:integration)
        id: gates
        run: |
          date +%s > "$RUNNER_TEMP/fdash-start"
          node tools/fdash/cli.ts run build --pkg server
          node tools/fdash/cli.ts run test:integration
        env:
          FDASH_LOG_DIR: ${{ runner.temp }}/fdash-logs
      - name: Logs of the checks
        if: failure() && steps.gates.outcome == 'failure'
        run: for f in "$RUNNER_TEMP"/fdash-logs/*/*.log; do echo "::group::$(basename "$f")"; cat "$f"; echo "::endgroup::"; done
      - name: Keep only the records this run used
        if: always() && github.ref == 'refs/heads/main' && github.event_name == 'push' && steps.gates.outcome != 'skipped'
        run: mkdir -p .fdash/cache && find .fdash/cache -type f ! -newermt "@$(cat "$RUNNER_TEMP/fdash-start")" -delete && find .fdash/cache -mindepth 1 -type d -empty -delete
      - name: Publish the records (main only)
        if: always() && github.ref == 'refs/heads/main' && github.event_name == 'push' && steps.gates.outcome != 'skipped'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fdash-integration
          path: .fdash/cache
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14

  # Real-browser end-to-end suite: Chrome with fake devices against a real LiveKit server, split into
  # shards balanced by measured scenario durations (e2e/shards.ts); each job runs one on its own runner,
  # through fdash so that scenarios which passed on main with the same inputs are not run again.
  e2e:
    name: e2e (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [unit]
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.27.3"
          cache-dependency-path: server/go.sum
      # the version comes from packageManager in the root package.json
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      # LiveKit's binary is cached by version: GitHub's release downloads fail now and then (a 504 page that
      # tar cannot read, or minutes of waiting), and each of the four shards would fetch it
      - name: LiveKit server cache
        id: livekit
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/livekit-bin
          key: livekit-server-1.13.7-linux-amd64
      - name: LiveKit server 1.13.7
        run: |
          if [ ! -x ~/.cache/livekit-bin/livekit-server ]; then
            mkdir -p ~/.cache/livekit-bin
            curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 -o "$RUNNER_TEMP/livekit.tar.gz" \
              https://github.com/livekit/livekit/releases/download/v1.13.7/livekit_1.13.7_linux_amd64.tar.gz
            tar xzf "$RUNNER_TEMP/livekit.tar.gz" -C ~/.cache/livekit-bin livekit-server
          fi
          sudo cp ~/.cache/livekit-bin/livekit-server /usr/local/bin/
          livekit-server --version
      - name: Chrome
        uses: browser-actions/setup-chrome@c785b87e244131f27c9f19c1a33e2ead956ab7ce # v1.7.3
        id: chrome
      - run: pnpm install --frozen-lockfile
      - name: Records of the scenarios that passed on main (its latest run's artifact)
        env:
          GH_TOKEN: ${{ github.token }}
          SHARD: ${{ matrix.shard }}
        run: node scripts/ci-fdash-records.ts "fdash-e2e-$SHARD"
      # the build first, in a run of its own: test:e2e uses bin/ and web/dist as they are (E2E_PREBUILT)
      # A shard holds scenarios of e2e/run.ts (the e2e project's items) and plugin e2e projects
      # (plugins/e2e/*, run by e2e/plugin-run.ts against the testbed, without LiveKit), balanced together
      # by e2e/shards.ts's plan.
      - name: Suite (fdash run build, then test:e2e with this shard's scenarios and e2e projects)
        id: suite
        env:
          CHROME: ${{ steps.chrome.outputs.chrome-path }}
          E2E_VIEWPORT: small
          FDASH_LOG_DIR: ${{ runner.temp }}/fdash-logs
          SHARD: ${{ matrix.shard }}
        run: |
          date +%s > "$RUNNER_TEMP/fdash-start"
          CHROME_VERSION="$("$CHROME" --version)"
          export CHROME_VERSION
          plan=$(node -e "import('./e2e/shards.ts').then((m) => { const p = m.plan(Number(process.env.SHARD), 4); console.log(p.scenarios.join(' ') + '|' + p.projects.join(' ')); })")
          read -ra scenarios <<< "${plan%%|*}"
          read -ra projects <<< "${plan#*|}"
          echo "shard $SHARD/4: scenarios: ${scenarios[*]:-none}; e2e projects: ${projects[*]:-none}"
          if [ ${#scenarios[@]} -eq 0 ] && [ ${#projects[@]} -eq 0 ]; then exit 0; fi
          node tools/fdash/cli.ts run build --pkg server --pkg web
          status=0
          # no item would mean every scenario: run the e2e project only when the shard has some
          if [ ${#scenarios[@]} -gt 0 ]; then node tools/fdash/cli.ts run test:e2e --pkg e2e -- "${scenarios[@]}" || status=1; fi
          if [ ${#projects[@]} -gt 0 ]; then
            pkgs=()
            for p in "${projects[@]}"; do pkgs+=(--pkg "$p"); done
            node tools/fdash/cli.ts run test:e2e "${pkgs[@]}" || status=1
          fi
          exit "$status"
      - name: Log of the suite
        if: always() && steps.suite.outcome != 'skipped'
        run: cat "$RUNNER_TEMP"/fdash-logs/*/*.log 2>/dev/null || echo "every scenario of this shard passed on main with the same inputs"
      - name: Keep only the records this run used
        if: always() && github.ref == 'refs/heads/main' && github.event_name == 'push' && steps.suite.outcome != 'skipped'
        run: mkdir -p .fdash/cache && find .fdash/cache -type f ! -newermt "@$(cat "$RUNNER_TEMP/fdash-start")" -delete && find .fdash/cache -mindepth 1 -type d -empty -delete
      - name: Publish the records (main only)
        if: always() && github.ref == 'refs/heads/main' && github.event_name == 'push' && steps.suite.outcome != 'skipped'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fdash-e2e-${{ matrix.shard }}
          path: .fdash/cache
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14
