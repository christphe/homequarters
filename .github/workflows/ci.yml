name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache-dependency-path: |
            server/go.sum
            bench/mediagen/go.sum
      - name: Format
        working-directory: server
        run: test -z "$(gofmt -l .)"
      - name: Vet
        working-directory: server
        run: go vet ./...
      - name: Test (race detector)
        working-directory: server
        run: go test -race -count=1 ./...
      - name: Build binaries
        working-directory: server
        run: |
          go build ./cmd/homequarters
          go build ./cmd/loadgen
      - name: Build the media benchmark tool
        working-directory: bench/mediagen
        run: go vet ./... && go build -o /dev/null .

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - run: pnpm exec tsc --noEmit
        working-directory: web
      - name: Web lint (bug classes tsc misses)
        run: node scripts/lint-web.mjs
      - name: Web unit tests (pure game logic)
        run: node --test 'web/test/*.test.ts'
      - name: E2E shard assignment and slots
        run: node --test e2e/shards.test.mjs e2e/slots.test.mjs
      - name: Type-check the web unit tests
        run: pnpm exec tsc -p tsconfig.test.json --noEmit
        working-directory: web
      - name: Type-check the plugins against plugins/sdk (the sample and the e2e test plugin)
        run: for p in ../plugins/bundled/hq-pets ../plugins/bundled/hq-pets/public ../plugins/bundled/hq-chess ../plugins/bundled/hq-chess/public ../e2e/fixtures/plugins/installed/ui-demo ../e2e/fixtures/plugins/installed/ui-demo/public ../e2e/fixtures/plugins/installed/critters ../e2e/fixtures/plugins/installed/drawn-sheet/public ../e2e/fixtures/plugins/installed/drawn-pet ../e2e/fixtures/plugins/installed/drawn-pet/public; do pnpm exec tsc -p "$p" || exit 1; done
        working-directory: web
      - name: Build and check the docs site (links, SEO metadata, sitemap, llms.txt)
        run: pnpm install --frozen-lockfile && node build.mjs && node check.mjs
        working-directory: site
      - run: pnpm exec vite build
        working-directory: web

  # Real-browser end-to-end suite: Chrome with fake devices against a real LiveKit server, split into
  # shards balanced by measured scenario durations (e2e/shards.mjs); each job runs one on its own runner.
  e2e:
    name: e2e (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [server, web]
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache-dependency-path: server/go.sum
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: LiveKit server 1.13.7
        run: |
          curl -sSL https://github.com/livekit/livekit/releases/download/v1.13.7/livekit_1.13.7_linux_amd64.tar.gz | tar xz livekit-server
          sudo mv livekit-server /usr/local/bin/
          livekit-server --version
      - name: Chrome
        uses: browser-actions/setup-chrome@v1
        id: chrome
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - run: pnpm install
        working-directory: e2e
      - name: Suite
        working-directory: e2e
        env:
          CHROME: ${{ steps.chrome.outputs.chrome-path }}
        run: node run.mjs --shard ${{ matrix.shard }}/4
