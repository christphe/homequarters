name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  actions: read # to download the records main's runs published

# The gates run through fdash (tools/fdash, fdash-workspace.json, decision 0035): a gate or a browser scenario
# that already passed on main with the same inputs is reported CACHED and not run again. The records come only
# from runs of a push to main, which publish them as an artifact of their own run; every job (a pull request's
# too) downloads that artifact from main's latest finished run. Nothing a pull request runs can add to it: a run
# of a pull request publishes no records, and reading them from anywhere else would need a change to this file
# in the pull request's final diff. actions/cache is not used because a pull request's own scope is searched
# first and an earlier commit of it could save one. Each main job publishes only the records its run used or
# made (fdash touches the records it finds; older ones are deleted first), so they stay the size of one run.

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache-dependency-path: |
            server/go.sum
            bench/mediagen/go.sum
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            web/pnpm-lock.yaml
            site/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - run: pnpm install --frozen-lockfile
        working-directory: site
      - name: Records of the gates that passed on main (its latest run's artifact)
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/ci-fdash-records.sh fdash-static
      - name: Static gates (fdash run static)
        id: gates
        run: |
          date +%s > "$RUNNER_TEMP/fdash-start"
          node tools/fdash/cli.ts run static
        env:
          FDASH_LOG_DIR: ${{ runner.temp }}/fdash-logs
      - name: Logs of the gates
        if: failure() && steps.gates.outcome == 'failure'
        run: for f in "$RUNNER_TEMP"/fdash-logs/*/*.log; do echo "::group::$(basename "$f")"; cat "$f"; echo "::endgroup::"; done
      - name: Logs of the gates (artifact)
        if: failure() && steps.gates.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: static-gate-logs
          path: ${{ runner.temp }}/fdash-logs
      - name: Keep only the records this run used
        if: always() && github.ref == 'refs/heads/main' && github.event_name == 'push' && steps.gates.outcome != 'skipped'
        run: mkdir -p .fdash/cache && find .fdash/cache -type f ! -newermt "@$(cat "$RUNNER_TEMP/fdash-start")" -delete
      - name: Publish the records (main only)
        if: always() && github.ref == 'refs/heads/main' && github.event_name == 'push' && steps.gates.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: fdash-static
          path: .fdash/cache
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14
      - name: Build binaries
        working-directory: server
        run: |
          go build ./cmd/homequarters
          go build ./cmd/loadgen
      - name: Build the media benchmark tool
        working-directory: bench/mediagen
        run: go vet ./... && go run honnef.co/go/tools/cmd/staticcheck@$(cd ../../server && go list -m -f '{{.Version}}' honnef.co/go/tools) ./... && go build -o /dev/null .

  # Real-browser end-to-end suite: Chrome with fake devices against a real LiveKit server, split into
  # shards balanced by measured scenario durations (e2e/shards.mjs); each job runs one on its own runner,
  # through fdash so that scenarios which passed on main with the same inputs are not run again.
  e2e:
    name: e2e (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [static]
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache-dependency-path: server/go.sum
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: LiveKit server 1.13.7
        run: |
          curl -sSL https://github.com/livekit/livekit/releases/download/v1.13.7/livekit_1.13.7_linux_amd64.tar.gz | tar xz livekit-server
          sudo mv livekit-server /usr/local/bin/
          livekit-server --version
      - name: Chrome
        uses: browser-actions/setup-chrome@v1
        id: chrome
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - run: pnpm install
        working-directory: e2e
      - name: Records of the scenarios that passed on main (its latest run's artifact)
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/ci-fdash-records.sh fdash-e2e-${{ matrix.shard }}
      - name: Suite (fdash run e2e:browser with this shard's scenarios)
        id: suite
        env:
          CHROME: ${{ steps.chrome.outputs.chrome-path }}
          E2E_VIEWPORT: small
          FDASH_LOG_DIR: ${{ runner.temp }}/fdash-logs
        run: |
          date +%s > "$RUNNER_TEMP/fdash-start"
          export CHROME_VERSION="$("$CHROME" --version)"
          scenarios=$(node -e "import('./e2e/shards.mjs').then((m) => console.log(m.shard(m.ALL, ${{ matrix.shard }}, 4).join(' ')))")
          echo "shard ${{ matrix.shard }}/4: $scenarios"
          if [ -z "$scenarios" ]; then exit 0; fi # no item would mean every scenario
          node tools/fdash/cli.ts run e2e:browser -- $scenarios
      - name: Log of the suite
        if: always() && steps.suite.outcome != 'skipped'
        run: cat "$RUNNER_TEMP"/fdash-logs/*/*.log 2>/dev/null || echo "every scenario of this shard passed on main with the same inputs"
      - name: Keep only the records this run used
        if: always() && github.ref == 'refs/heads/main' && github.event_name == 'push' && steps.suite.outcome != 'skipped'
        run: mkdir -p .fdash/cache && find .fdash/cache -type f ! -newermt "@$(cat "$RUNNER_TEMP/fdash-start")" -delete
      - name: Publish the records (main only)
        if: always() && github.ref == 'refs/heads/main' && github.event_name == 'push' && steps.suite.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: fdash-e2e-${{ matrix.shard }}
          path: .fdash/cache
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14
