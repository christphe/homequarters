name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
    # deploy/README.md is published as the self-hosting page; README.md is checked by site/check.ts
    paths: ["site/**", "docs/**", "deploy/README.md", "README.md", "package.json", "pnpm-lock.yaml", "pnpm-workspace.yaml", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history, for the sitemap's lastmod dates
      # the version comes from packageManager in the root package.json
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      # at the root (one lockfile for the repository), only what the site needs
      - run: pnpm install --frozen-lockfile --filter homequarters-site
      - name: Build site
        working-directory: site
        run: |
          node build.ts
          node check.ts
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
