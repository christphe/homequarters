<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Home Quarters · art preview</title>
    <style>
      body { margin: 0; background: #1b1830; color: #f2eefc; font: 14px system-ui; }
      h2 { margin: 16px; font-weight: 600; }
      canvas { image-rendering: pixelated; display: block; margin: 8px 16px; }
      .row { display: flex; flex-wrap: wrap; gap: 8px 24px; }
      #wardrobe { display: flex; flex-wrap: wrap; gap: 4px 28px; padding: 0 16px 16px; }
      #wardrobe figure { margin: 0; }
      #wardrobe canvas { margin: 0; }
      #wardrobe figcaption { font-size: 13px; opacity: 0.85; }
      #wardrobe h3 { flex-basis: 100%; margin: 12px 0 0; font-size: 15px; }
    </style>
  </head>
  <body>
    <h2>Sprites (idle + walk, four directions)</h2>
    <div class="row" id="sheets"></div>
    <h2>Wardrobe (idle: down, left, right, up)</h2>
    <div id="wardrobe"></div>
    <h2>Map</h2>
    <canvas id="map"></canvas>
    <script type="module" src="./art-preview.ts"></script>
  </body>
</html>
